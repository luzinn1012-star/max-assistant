[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "data", "logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["config.py", "main.py", "core", "brain", "skills", "automation", "benchmarks", "scripts"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["core.errors", "core.capabilities", "core.intent", "core.observability", "automation.contracts", "brain.provider", "skills.base"]
disallow_untyped_defs = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = [
  "unit: deterministic unit tests",
  "integration: component composition with injected adapters",
  "windows: Windows adapter tests, using mocks unless explicitly live",
  "providers: provider contracts and local HTTP doubles",
  "live: opt-in external services or actual Windows control",
]

[tool.coverage.run]
branch = true
source = ["core", "brain", "skills", "automation", "config", "main"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.coverage.json]
output = "data/coverage.json"

[tool.coverage.xml]
output = "data/coverage.xml"
